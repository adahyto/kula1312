version: "3"

# Docker keeps container logs until the container is removed; cap them by size
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nodeserver:
    restart: always
    logging: *logging
    # Caps so that one runaway container cannot take the whole server down (peak use 2026-10-09: ~30 MB)
    mem_limit: 512m
    pids_limit: 256
    build:
      context: ./app
    ports:
      - "127.0.0.1:3009:3009"
  nginx:
    logging: *logging
    restart: always
    mem_limit: 128m
    pids_limit: 64
    build:
      context: ./nginx
    ports:
      - "127.0.0.1:91:80"
