version: "3"

# Docker keeps container logs until the container is removed; cap them by size
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nodeserver:
    restart: always
    logging: *logging
    build:
      context: ./app
    ports:
      - "127.0.0.1:3009:3009"
  nginx:
    logging: *logging
    restart: always
    build:
      context: ./nginx
    ports:
      - "91:80"
