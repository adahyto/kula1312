server {
    # kula.doner.cloud stays out of search results (author's decision 2026-11-12): every answer says so
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Everything the page loads comes from here; Svelte sets some style attributes. Framed only by itself, as
    # Apache's X-Frame-Options SAMEORIGIN says
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # No sitemap: the app answers every address with its page, which is not one
    location = /sitemap.xml {
        return 404;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://nodeserver:3009;
    }
}
